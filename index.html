:760px}.weekdays,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays{border-bottom:1px solid var(--border);background:var(--surface)}.weekday{padding:10px;text-align:center;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.06em}.cal-grid{background:var(--border);gap:1px}.day{min-height:150px;background:var(--bg);padding:11px}.day.out{background:#f7f5f2;color:#a8a29e}.day.today{box-shadow:inset 0 0 0 2px var(--primary)}.day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.day-num{font-size:14px;font-weight:700}.day-count{font-size:12px;color:var(--muted)}.day-events{min-height:84px;display:flex;flex-direction:column;gap:6px}.event,.list-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--primary);box-shadow:0 1px 0 rgba(28,25,23,.02);cursor:pointer}.event{border-radius:8px;padding:8px 9px;font-size:13px;line-height:1.38}.event:hover{box-shadow:var(--shadow);transform:translateY(-1px)}.meta{font-size:11px;color:var(--muted);margin-top:3px}.event[data-cat="研究"],.list-card[data-cat="研究"]{border-left-color:#a16207}.event[data-cat="老師"],.list-card[data-cat="老師"]{border-left-color:#7c3aed}.event[data-cat="假日"],.list-card[data-cat="假日"]{border-left-color:var(--red);background:#fff1f0}.event[data-cat="備註"],.list-card[data-cat="備註"]{border-left-color:#f59e0b}.event-row{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}.del{cursor:pointer;color:var(--muted);font-size:12px;line-height:1.4;padding:1px 4px;border-radius:4px}.del:hover{color:white;background:var(--red)}.list-view{padding:8px 0}.week-block{padding:18px 20px;border-bottom:1px solid var(--border)}.week-block:last-child{border-bottom:0}.week-title{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}.week-title h3{font-size:19px}.date-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:6px 0}.date-label{font-size:15px;font-weight:700;padding-top:7px}.date-drop{min-height:36px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-radius:10px;padding:5px}.list-card{display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:360px;border-radius:999px;padding:6px 10px 6px 14px}.list-card-title{font-weight:700;font-size:15px}.empty{padding:40px;text-align:center;color:var(--muted)}.sheet-note{margin-top:16px;padding:12px 14px;border-radius:12px;border:1px dashed var(--border);color:var(--text2);font-size:14px;background:rgba(245,245,244,.55)}.drag-ghost{opacity:.35}.drag-chosen{box-shadow:0 12px 28px rgba(28,25,23,.14)!important}.modal-overlay{position:fixed;inset:0;background:rgba(28,25,23,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}.modal-box{background:var(--bg);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-width:430px;width:100%;padding:22px;border:1px solid var(--border)}.modal-title{font-weight:800;margin-bottom:8px}.modal-label{display:block;margin-top:10px}.modal-label span{display:block;font-size:13px;font-weight:700;color:var(--text2);margin-bottom:5px}.modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:.25s;z-index:1000;max-width:80vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}body.readonly .edit-only,body.readonly .del{display:none!important}body.readonly .event,body.readonly .list-card{cursor:default}body.readonly .event:hover{transform:none}.hidden{display:none!important}@media(max-width:900px){:root{--sidebar:220px}.main{padding:24px 20px 48px}.headline h2{font-size:36px}.toolbar{grid-template-columns:1fr}.chips{justify-content:flex-start}}@media(max-width:720px){.app{display:block}.sidebar{display:none}.main{padding:20px 14px 40px}.topbar{display:block}.actions{margin-top:16px;justify-content:flex-start}.headline h2{font-size:32px}.date-row{grid-template-columns:78px 1fr}.list-card{min-width:100%;max-width:none}.calendar{min-width:690px}.day{min-height:138px}}

body:not(.readonly) .day{cursor:pointer}body:not(.readonly) .day:hover{background:#fff7ed}body:not(.readonly) .day:focus-visible{outline:3px solid var(--primary);outline-offset:-3px}
.cal-grid{display:block;gap:0}.cal-week{position:relative}.week-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;border-bottom:1px solid var(--border)}.cal-week:last-child .week-days{border-bottom:0}.cal-week .day{background:#fff}.cal-week .day.out{background:#f8f7f5}.cal-week .day-events{margin-top:var(--range-space,0px)}.range-lanes{position:absolute;z-index:2;top:40px;left:0;right:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:24px;row-gap:3px;pointer-events:none}.range-bar{min-width:0;display:flex;align-items:center;gap:6px;margin:0 3px;padding:2px 8px;border-radius:4px;background:var(--range-color);color:#fff;font-size:12px;line-height:1.2;pointer-events:auto}.range-bar.range-continues{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}.range-bar.range-continues-next{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}.range-bar .range-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}.range-bar .range-dates{margin-left:auto;white-space:nowrap;font-size:11px;opacity:.9}.range-bar .del{margin-left:2px;color:#fff}.range-bar .del:hover{background:rgba(0,0,0,.22)}body:not(.readonly) .range-bar{cursor:grab}body.readonly .range-bar{cursor:default}.range-bar:hover{filter:brightness(1.12)}
.list-card-range{font-size:12px;color:var(--text2);white-space:nowrap}@media(max-width:900px){.range-bar .range-dates{display:none}}

<script>
const SUPABASE_URL='https://tqpyhgsmliwwxxbrctdk.supabase.co';
const SUPABASE_KEY='sb_publishable_XNZQrshFUCpcRmZHqwV0_Q_wfznQHde';
const PROJECT_ID='kingfish-vlog';
const cats=['全部','行銷','研究','老師','假日','備註'];
const catColors={行銷:'#c2410c',研究:'#a16207',老師:'#7c3aed',假日:'#dc2626',備註:'#f59e0b'};
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{detectSessionInUrl:true,flowType:'implicit',persistSession:true,autoRefreshToken:true}});
let session=null,events=[],currentView='calendar',filter='全部',query='',cursor=new Date(new Date().getFullYear(),new Date().getMonth(),1);
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function fmtDate(s){return new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric',weekday:'short'}).format(new Date(s+'T00:00:00'))}
function dayNumber(s){const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/86400000}
function dayDiff(a,b){return dayNumber(b)-dayNumber(a)}
function shiftDate(s,days){const [y,m,d]=s.split('-').map(Number);const t=new Date(Date.UTC(y,m-1,d+days));return t.toISOString().slice(0,10)}
function eventEnd(e){return e.endDate||e.date}
function isRange(e){return eventEnd(e)>e.date}
function activeOn(e,date){return e.date<=date&&eventEnd(e)>=date}
function shortDate(s){return s.slice(5).replace('-','/')}
function rangeLabel(e){return `${shortDate(e.date)}–${shortDate(eventEnd(e))}`}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('show'));setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),300)},2400)}
function setStatus(msg,type=''){const el=$('statusLine');el.textContent=msg;el.className='status '+type}
function canWrite(){return Boolean(session?.user)}
function sourceWeekForDate(date){const t=new Date(date+'T00:00:00');const d=(t.getDay()+6)%7;const th=new Date(t);th.setDate(t.getDate()-d+3);const first=new Date(th.getFullYear(),0,4);const firstMon=new Date(first);firstMon.setDate(first.getDate()-((first.getDay()+6)%7));return 'W'+(Math.floor((th-firstMon)/604800000)+1)}
function isoWeekYear(date){const t=new Date(date+'T00:00:00');const d=(t.getDay()+6)%7;const th=new Date(t);th.setDate(t.getDate()-d+3);return th.getFullYear()}
function fromDb(r){return{id:r.id,date:r.date,endDate:r.end_date||r.date,title:r.title,category:r.category,week:r.week||sourceWeekForDate(r.date),originalDate:r.original_date||r.date,sortOrder:r.sort_order??0}}
function toDb(e,sort=e.sortOrder??0){return{project_id:PROJECT_ID,id:e.id,date:e.date,end_date:eventEnd(e)>e.date?eventEnd(e):null,title:e.title,category:e.category,week:e.week||sourceWeekForDate(e.date),original_date:e.originalDate||e.date,sort_order:sort,updated_at:new Date().toISOString()}}
function renderSetup(){const legend=$('legend'),chips=$('chips'),addCat=$('addCategory');legend.innerHTML='';chips.innerHTML='';addCat.innerHTML='';cats.forEach(cat=>{if(cat!=='全部'){legend.insertAdjacentHTML('beforeend',`<div class="legend-row"><span class="dot" style="background:${catColors[cat]}"></span>${cat}</div>`);addCat.insertAdjacentHTML('beforeend',`<option value="${cat}">${cat}</option>`)}chips.insertAdjacentHTML('beforeend',`<button class="chip ${cat==='全部'?'active':''}" data-filter="${cat}">${cat}</button>`)});document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');filter=c.dataset.filter;renderAll()})}
async function loadEvents(){const {data,error}=await sb.from('schedule_events').select('id,project_id,date,end_date,title,category,week,original_date,sort_order').eq('project_id',PROJECT_ID).order('date',{ascending:true}).order('sort_order',{ascending:true});if(error){setStatus('讀取失敗：'+error.message,'err');events=[]}else{events=(data||[]).map(fromDb);setStatus(canWrite()?`已登入：${session.user.email}`:`已同步 ${events.length} 筆 Supabase 時程`,'ok')}renderAll()}
async function refreshSession(){const {data}=await sb.auth.getSession();session=data.session;document.body.classList.toggle('readonly',!canWrite());$('loginSection').classList.toggle('hidden',canWrite());$('modeText').textContent=canWrite()?`編輯模式：${session.user.email}`:'公開檢視模式';$('helpText').textContent=canWrite()?'點日期空白處可新增；拖曳可移動；點卡片可編輯':'公開讀取 Supabase；登入後可編輯';renderAll()}
async function signIn(){const email=$('loginEmail').value.trim(),password=$('loginPassword').value;if(!email||!password){setStatus('請輸入 Email 和密碼。','warn');return}const btn=$('loginBtn');btn.disabled=true;try{const {error}=await sb.auth.signInWithPassword({email,password});if(error){setStatus('登入失敗：請確認 Email 和密碼。','err');return}$('loginPassword').value='';await refreshSession();setStatus('已登入編輯模式。','ok')}finally{btn.disabled=false}}
async function requestPasswordReset(){const email=$('loginEmail').value.trim();if(!email){setStatus('請先輸入 Email，再按「首次設定／忘記密碼」。','warn');$('loginEmail').focus();return}const btn=$('resetPasswordBtn');btn.disabled=true;try{const redirectTo=location.origin+location.pathname;const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});if(error){setStatus('無法寄送設定密碼郵件：'+error.message,'err');return}setStatus('如果此 Email 已有帳號，請查看信箱中的設定密碼郵件。','ok')}finally{btn.disabled=false}}
function passwordModal(isRecovery=false){if(document.querySelector('.modal-overlay'))return;const o=document.createElement('div');o.className='modal-overlay';const b=document.createElement('div');b.className='modal-box';b.innerHTML='<div class="modal-title">'+(isRecovery?'設定新密碼':'設定／修改密碼')+'</div><div class="password-help">請輸入至少 8 個字元的密碼。</div>';const pass=document.createElement('input');pass.type='password';pass.className='field';pass.autocomplete='new-password';pass.placeholder='新密碼';const again=document.createElement('input');again.type='password';again.className='field';again.autocomplete='new-password';again.placeholder='再次輸入新密碼';b.append(modalField('新密碼',pass),modalField('確認新密碼',again));const row=document.createElement('div');row.className='modal-btns';const cancel=document.createElement('button');cancel.className='btn';cancel.textContent='取消';const save=document.createElement('button');save.className='btn primary';save.textContent='儲存密碼';row.append(cancel,save);b.appendChild(row);o.appendChild(b);document.body.appendChild(o);pass.focus();cancel.onclick=()=>o.remove();save.onclick=async()=>{if(pass.value.length<8){toast('密碼至少需要 8 個字元');return}if(pass.value!==again.value){toast('兩次輸入的密碼不同');return}save.disabled=true;const {error}=await sb.auth.updateUser({password:pass.value});save.disabled=false;if(error){setStatus('設定密碼失敗：'+error.message,'err');return}pass.value='';again.value='';o.remove();if(isRecovery&&location.hash)history.replaceState(null,'',location.pathname+location.search);setStatus('密碼已設定，下次可直接用 Email 和密碼登入。','ok')}}

async function signOut(){await sb.auth.signOut();session=null;await refreshSession();setStatus('已登出，回到公開檢視模式。','ok')}
function visible(e){const q=query.trim().toLowerCase();return (filter==='全部'||e.category===filter)&&(!q||`${e.title} ${e.category} ${e.week}`.toLowerCase().includes(q))}
function eventHTML(e,mode='cal'){const del=canWrite()?`<span class="del" data-id="${esc(e.id)}" title="刪除">✕</span>`:'';if(mode==='cal')return`<div class="event" data-id="${esc(e.id)}" data-cat="${esc(e.category)}"><div class="event-row"><span>${esc(e.title)}</span>${del}</div><div class="meta">${esc(e.category)} · ${isoWeekYear(e.date)} · ${esc(e.week)}</div></div>`;return`<div class="list-card" data-id="${esc(e.id)}" data-cat="${esc(e.category)}" data-occurrence="${e.date}"><span class="list-card-title">${esc(e.title)}</span>${isRange(e)?`<span class="list-card-range">↔ ${rangeLabel(e)}</span>`:''}${del}</div>`}
function rangeBarHTML(e,weekStart,weekEnd,lane){const first=e.date>weekStart?e.date:weekStart,last=eventEnd(e)<weekEnd?eventEnd(e):weekEnd,col=dayDiff(weekStart,first)+1,span=dayDiff(first,last)+1,continues=e.date<weekStart,continuesNext=eventEnd(e)>weekEnd,begin=continues?'← ':'',finish=continuesNext?' →':'';const del=canWrite()?`<span class="del" data-id="${esc(e.id)}" title="刪除整個區間活動">✕</span>`:'';return`<div class="range-bar ${continues?'range-continues':''} ${continuesNext?'range-continues-next':''}" data-id="${esc(e.id)}" data-occurrence="${first}" data-cat="${esc(e.category)}" ${canWrite()?'role="button" tabindex="0"':''} style="grid-column:${col}/span ${span};grid-row:${lane};--range-color:${catColors[e.category]||catColors.行銷}" title="${esc(e.title)}｜${rangeLabel(e)}"><span class="range-title">${begin}${esc(e.title)}${finish}</span><span class="range-dates">${rangeLabel(e)}</span>${del}</div>`}
function currentWeekDates(now=new Date()){const start=new Date(now.getFullYear(),now.getMonth(),now.getDate());start.setDate(start.getDate()-((start.getDay()+6)%7));return Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return iso(d)})}
function renderWeekly(){const dates=currentWeekDates(),today=iso(new Date()),names=['週一','週二','週三','週四','週五','週六','週日'];const shown=events.filter(visible).filter(e=>e.date<=dates[6]&&eventEnd(e)>=dates[0]);$('weeklyRange').textContent=`${fmtDate(dates[0])} – ${fmtDate(dates[6])}`;$('weeklyCount').textContent=`${shown.length} 項`;const byDate=new Map(dates.map(d=>[d,shown.filter(e=>activeOn(e,d))]));$('weeklyRoot').innerHTML=dates.map((date,i)=>`<div class="weekly-day ${date===today?'today':''}"><div class="weekly-date ${date===today?'today':''}">${names[i]} · ${shortDate(date)}</div><div class="weekly-items">${byDate.get(date).length?byDate.get(date).map(e=>`<div class="weekly-item" data-cat="${esc(e.category)}">${isRange(e)?'↔ ':''}${esc(e.title)}${isRange(e)?`<div class="meta">${rangeLabel(e)}</div>`:''}</div>`).join(''):'<span class="weekly-empty">—</span>'}</div></div>`).join('')}
function renderCalendar(){const y=cursor.getFullYear(),m=cursor.getMonth();$('periodLabel').textContent=`${y} 年 ${m+1} 月`;const first=new Date(y,m,1),start=new Date(first);start.setDate(1-first.getDay());let out='',today=iso(new Date());for(let w=0;w<6;w++){const weekStart=shiftDate(iso(start),w*7),weekEnd=shiftDate(weekStart,6),ranges=events.filter(e=>visible(e)&&isRange(e)&&e.date<=weekEnd&&eventEnd(e)>=weekStart).sort((a,b)=>(a.date>weekStart?a.date:weekStart).localeCompare(b.date>weekStart?b.date:weekStart)||dayDiff(eventEnd(a),eventEnd(b)));const occupied=[],bars=ranges.map(e=>{const col=dayDiff(weekStart,e.date>weekStart?e.date:weekStart)+1,last=dayDiff(weekStart,eventEnd(e)<weekEnd?eventEnd(e):weekEnd)+1;let lane=occupied.findIndex(end=>end<col);if(lane<0){lane=occupied.length;occupied.push(last)}else occupied[lane]=last;return rangeBarHTML(e,weekStart,weekEnd,lane+1)});out+=`<div class="cal-week" style="--range-space:${occupied.length?occupied.length*27+2:0}px">`;out+='<div class="week-days">';for(let i=0;i<7;i++){const d=new Date(y,m,1-first.getDay()+w*7+i),ds=iso(d),evs=events.filter(e=>visible(e)&&activeOn(e,ds)),singles=evs.filter(e=>!isRange(e));out+=`<div class="day ${d.getMonth()===m?'':'out'} ${ds===today?'today':''}" data-date="${ds}" ${canWrite()?`role="button" tabindex="0" aria-label="${ds} 新增活動"`:''}><div class="day-head"><span class="day-num">${d.getDate()}</span><span class="day-count">${evs.length?evs.length+' 項':''}</span></div><div class="day-events">${singles.map(e=>eventHTML(e,'cal')).join('')}</div></div>`}out+='</div>';if(bars.length)out+=`<div class="range-lanes">${bars.join('')}</div>`;out+='</div>'}$('calGrid').innerHTML=out;initSortables('.day-events',true);initRangeSortables()}
function renderList(){const map=new Map();events.filter(visible).forEach(e=>{const key=`${isoWeekYear(e.date)} · ${e.week}`;if(!map.has(key))map.set(key,[]);map.get(key).push(e)});let html='';[...map.entries()].sort((a,b)=>a[1][0].date.localeCompare(b[1][0].date)).forEach(([week,items])=>{html+=`<section class="week-block"><div class="week-title"><h3>${esc(week)}</h3></div>`;const byDate={};items.forEach(e=>{if(!byDate[e.date])byDate[e.date]=[];byDate[e.date].push(e)});Object.keys(byDate).sort().forEach(date=>{html+=`<div class="date-row"><div class="date-label">${fmtDate(date)}</div><div class="date-drop" data-date="${date}">${byDate[date].map(e=>eventHTML(e,'list')).join('')}</div></div>`});html+='</section>'});$('listRoot').innerHTML=html||'<div class="empty">沒有符合條件的日程</div>';initSortables('.date-drop',false)}
function renderAll(){renderWeekly();renderCalendar();renderList();const shown=events.filter(visible).length;$('countLabel').textContent=`顯示 ${shown} / ${events.length} 個日程`;['prevBtn','nextBtn','todayBtn'].forEach(id=>$(id).style.visibility=currentView==='calendar'?'visible':'hidden')}
function setView(v){currentView=v;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===(v==='calendar'?'calendarView':'listView')));document.querySelectorAll('.nav-btn[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$('viewTitle').textContent=v==='calendar'?'專案時程｜行事曆':'專案時程｜清單';$('toggleBtn').textContent=v==='calendar'?'切換清單':'切換行事曆';renderAll()}
function initSortables(selector,isCal){if(!window.Sortable||!canWrite())return;document.querySelectorAll(selector).forEach(el=>new Sortable(el,{group:'schedule',animation:160,delay:120,delayOnTouchOnly:true,touchStartThreshold:4,ghostClass:'drag-ghost',chosenClass:'drag-chosen',filter:'.del',preventOnFilter:false,onAdd(evt){const target=(isCal?evt.item.closest('.day'):evt.item.closest('.date-drop'))?.dataset.date,source=evt.item.dataset.occurrence||evt.from.closest('.day,.date-drop')?.dataset.date,e=events.find(x=>x.id===evt.item.dataset.id);if(target&&source&&e)updateEvent(e.id,{date:shiftDate(e.date,dayDiff(source,target))})},onUpdate(evt){const date=(isCal?evt.item.closest('.day'):evt.item.closest('.date-drop'))?.dataset.date;if(date)saveSort(date)}}))}
function initRangeSortables(){if(!window.Sortable||!canWrite())return;document.querySelectorAll('.range-lanes').forEach(el=>new Sortable(el,{group:{name:'schedule',pull:true,put:false},sort:false,draggable:'.range-bar',animation:160,delay:120,delayOnTouchOnly:true,touchStartThreshold:4,ghostClass:'drag-ghost',chosenClass:'drag-chosen',filter:'.del',preventOnFilter:false}))}
async function saveSort(date){if(!canWrite())return;const evs=events.filter(e=>e.date===date);evs.forEach((e,i)=>e.sortOrder=i);await Promise.all(evs.map((e,i)=>sb.from('schedule_events').update({sort_order:i,updated_at:new Date().toISOString()}).eq('project_id',PROJECT_ID).eq('id',e.id)))}
function modalField(label,el){const w=document.createElement('label');w.className='modal-label';w.innerHTML=`<span>${label}</span>`;w.appendChild(el);return w}
function editModal(ev){return new Promise(resolve=>{const o=document.createElement('div');o.className='modal-overlay';const b=document.createElement('div');b.className='modal-box';b.innerHTML='<div class="modal-title">編輯活動</div>';const title=document.createElement('input');title.className='field';title.value=ev.title;const date=document.createElement('input');date.type='date';date.className='field';date.value=ev.date;const end=document.createElement('input');end.type='date';end.className='field';end.value=eventEnd(ev);date.onchange=()=>{if(end.value<date.value)end.value=date.value};const cat=document.createElement('select');cat.className='field';cats.filter(c=>c!=='全部').forEach(c=>cat.insertAdjacentHTML('beforeend',`<option value="${c}" ${c===ev.category?'selected':''}>${c}</option>`));b.append(modalField('活動名稱',title),modalField('開始日期',date),modalField('結束日期（單日可與開始日期相同）',end),modalField('分類標籤',cat));const row=document.createElement('div');row.className='modal-btns';row.innerHTML='<button class="btn" id="mCancel">取消</button><button class="btn primary" id="mSave">儲存修改</button>';b.appendChild(row);o.appendChild(b);document.body.appendChild(o);title.focus();title.select();row.querySelector('#mCancel').onclick=()=>{o.remove();resolve(null)};row.querySelector('#mSave').onclick=()=>{const t=title.value.trim();if(!t){toast('請輸入活動名稱');title.focus();return}if(!date.value){toast('請選擇開始日期');date.focus();return}if(!end.value||end.value<date.value){toast('結束日期不能早於開始日期');end.focus();return}o.remove();resolve({title:t,date:date.value,endDate:end.value,category:cat.value})}})}
async function updateEvent(id,changes){if(!canWrite()){toast('請先登入後再編輯');return}const e=events.find(x=>x.id===id);if(!e)return;const old={...e};const next={...e,...changes};if(changes.date&&!Object.hasOwn(changes,'endDate'))next.endDate=shiftDate(eventEnd(e),dayDiff(e.date,changes.date));next.title=next.title.trim();if(!next.date||eventEnd(next)<next.date){toast('結束日期不能早於開始日期');return}next.week=sourceWeekForDate(next.date);Object.assign(e,next);renderAll();const {error}=await sb.from('schedule_events').update({title:next.title,date:next.date,end_date:isRange(next)?eventEnd(next):null,category:next.category,week:next.week,updated_at:new Date().toISOString()}).eq('project_id',PROJECT_ID).eq('id',id);if(error){Object.assign(e,old);renderAll();setStatus('更新失敗：'+error.message,'err');return}toast('已儲存「'+next.title+'」')}
async function createEvent(date,title,category,endDate=date){if(!canWrite()){toast('請先登入後再新增');return false}title=title.trim();endDate=endDate||date;if(!date||!title){toast(!date?'請選擇開始日期':'請輸入任務標題');return false}if(endDate<date){toast('結束日期不能早於開始日期');return false}const e={id:'c'+Date.now()+Math.floor(Math.random()*1000),date,endDate,title,category,week:sourceWeekForDate(date),originalDate:date,sortOrder:events.filter(x=>x.date===date).length};const {data,error}=await sb.from('schedule_events').insert(toDb(e)).select('id,project_id,date,end_date,title,category,week,original_date,sort_order').single();if(error){setStatus('新增失敗：'+error.message,'err');return false}events.push(fromDb(data));renderAll();toast('已新增「'+title+'」');return true}
async function addEvent(){if(await createEvent($('addDate').value,$('addTitle').value,$('addCategory').value,$('addEndDate').value)){$('addTitle').value='';$('addEndDate').value=''}}
function addEventModal(selectedDate){if(!canWrite()||document.querySelector('.modal-overlay'))return;const o=document.createElement('div');o.className='modal-overlay';const b=document.createElement('div');b.className='modal-box';b.innerHTML='<div class="modal-title">新增活動</div>';const title=document.createElement('input');title.className='field';title.placeholder='活動名稱';const date=document.createElement('input');date.type='date';date.className='field';date.value=selectedDate;const end=document.createElement('input');end.type='date';end.className='field';end.value=selectedDate;date.onchange=()=>{if(end.value<date.value)end.value=date.value};const cat=document.createElement('select');cat.className='field';cats.filter(c=>c!=='全部').forEach(c=>cat.insertAdjacentHTML('beforeend',`<option value="${c}">${c}</option>`));b.append(modalField('活動名稱',title),modalField('開始日期',date),modalField('結束日期（單日可與開始日期相同）',end),modalField('分類標籤',cat));const row=document.createElement('div');row.className='modal-btns';const cancel=document.createElement('button');cancel.className='btn';cancel.textContent='取消';const save=document.createElement('button');save.className='btn primary';save.textContent='新增活動';row.append(cancel,save);b.appendChild(row);o.appendChild(b);document.body.appendChild(o);title.focus();cancel.onclick=()=>o.remove();save.onclick=async()=>{save.disabled=true;try{if(await createEvent(date.value,title.value,cat.value,end.value))o.remove()}finally{save.disabled=false}}}
async function deleteEvent(id){if(!canWrite())return;const e=events.find(x=>x.id===id);if(!e)return;if(!confirm('要刪除「'+e.title+'」'+(isRange(e)?`（${rangeLabel(e)}）`:'')+'嗎？'))return;const {error}=await sb.from('schedule_events').delete().eq('project_id',PROJECT_ID).eq('id',id);if(error){setStatus('刪除失敗：'+error.message,'err');return}events=events.filter(x=>x.id!==id);renderAll();toast('已刪除')}
function exportData(){download('schedule-backup.json',JSON.stringify({exportedAt:new Date().toISOString(),source:'Supabase 專案時程',events},null,2),'application/json')}
function exportICS(){const pad=n=>String(n).padStart(2,'0'),ds=s=>s.replace(/-/g,''),now=new Date(),stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z',escI=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ember Studio//Project Schedule//ZH-TW','CALSCALE:GREGORIAN'];events.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>lines.push('BEGIN:VEVENT','UID:'+e.id+'-goldenfish@eritung','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+ds(e.date),'DTEND;VALUE=DATE:'+ds(shiftDate(eventEnd(e),1)),'SUMMARY:'+escI(e.title),'CATEGORIES:'+escI(e.category),'DESCRIPTION:'+escI(`分類：${e.category}／週次：${e.week}`),'END:VEVENT'));lines.push('END:VCALENDAR');download('project-schedule.ics',lines.join('\r\n'),'text/calendar')}
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:type+';charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
async function boot(){try{renderSetup();document.querySelectorAll('.nav-btn[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('toggleBtn').onclick=()=>setView(currentView==='calendar'?'list':'calendar');$('prevBtn').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);renderCalendar()};$('nextBtn').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);renderCalendar()};$('todayBtn').onclick=()=>{const n=new Date();cursor=new Date(n.getFullYear(),n.getMonth(),1);renderCalendar()};$('searchInput').oninput=e=>{query=e.target.value;renderAll()};$('loginForm').onsubmit=e=>{e.preventDefault();signIn()};$('resetPasswordBtn').onclick=requestPasswordReset;$('changePasswordBtn').onclick=()=>passwordModal(false);$('signOutBtn').onclick=signOut;$('addEventBtn').onclick=addEvent;$('exportDataBtn').onclick=exportData;$('exportIcsBtn').onclick=exportICS;document.addEventListener('click',async e=>{const del=e.target.closest('.del');if(del){e.stopPropagation();deleteEvent(del.dataset.id);return}const card=e.target.closest('.event,.list-card,.range-bar');if(card&&canWrite()){const ev=events.find(x=>x.id===card.dataset.id);const res=ev&&await editModal(ev);if(res)updateEvent(ev.id,res);return}const day=e.target.closest('#calGrid .day');if(day&&canWrite()&&!e.target.closest('.event,.del'))addEventModal(day.dataset.date)});$('calGrid').addEventListener('keydown',async e=>{if(!canWrite()||(e.key!=='Enter'&&e.key!==' '))return;if(e.target.classList.contains('day')){e.preventDefault();addEventModal(e.target.dataset.date)}else if(e.target.classList.contains('range-bar')){e.preventDefault();const ev=events.find(x=>x.id===e.target.dataset.id);const res=ev&&await editModal(ev);if(res)updateEvent(ev.id,res)}});sb.auth.onAuthStateChange((event,s)=>{session=s;setTimeout(()=>{refreshSession();if(event==='PASSWORD_RECOVERY')passwordModal(true)},0)});await refreshSession();await loadEvents();setView('calendar');setInterval(()=>{if(!document.hidden)renderWeekly()},60000)}catch(err){console.error(err);setStatus('初始化失敗：'+(err?.message||err),'err')}}
boot();
</script>
