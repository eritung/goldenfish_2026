<style>
:root{--primary:#c2410c;--primary2:#9a3412;--bg:#fafaf9;--surface:#f5f5f4;--text:#1c1917;--text2:#57534e;--muted:#78716c;--border:#d6d3d1;--red:#dc2626;--shadow:0 6px 18px rgba(28,25,23,.08);--sidebar:256px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Source Sans 3",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.48}button,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;overflow:auto;padding:24px 16px;border-right:1px solid var(--border);background:rgba(250,250,249,.94);backdrop-filter:blur(14px)}.brand{padding:4px 8px 20px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}h1,h2,h3{margin:0}h1,h2{font-family:"Playfair Display",serif;letter-spacing:-.02em}h1{font-size:30px;line-height:1.15;margin-top:5px}.nav-section{margin-top:20px}.nav-label{padding:0 10px 8px;color:var(--muted);font-size:13px;font-weight:700}.nav-btn{width:100%;display:flex;gap:10px;border:0;background:transparent;color:var(--text2);padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left}.nav-btn:hover{background:var(--surface)}.nav-btn.active{color:var(--primary);background:#fff2ec}.legend{display:grid;gap:8px}.legend-row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);padding:0 10px}.dot{width:8px;height:8px;border-radius:99px}.field{height:38px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 10px;color:var(--text);width:100%;outline:0}.field:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(194,65,12,.12)}.stack{display:flex;flex-direction:column;gap:8px}.hint{font-size:12px;line-height:1.45;color:var(--muted);padding:0 2px}.status{font-size:12px;line-height:1.45;padding:8px 10px;border-radius:8px;background:var(--surface);color:var(--text2);border:1px solid var(--border)}.status.ok{border-color:rgba(22,163,74,.35);color:#166534;background:#f0fdf4}.status.warn{border-color:rgba(217,119,6,.35);color:#92400e;background:#fffbeb}.status.err{border-color:rgba(220,38,38,.35);color:#991b1b;background:#fef2f2}.btn{height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--border);background:white;color:var(--text);font-weight:700;cursor:pointer}.btn:hover{background:var(--surface)}.btn.primary{background:var(--primary);border-color:var(--primary);color:white}.btn.primary:hover{background:var(--primary2)}.btn.icon{width:40px;padding:0}.main{min-width:0;padding:32px 32px 64px}.container{max-width:1200px;margin:auto}.topbar{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:24px}.headline h2{font-size:44px;line-height:1.05}.headline p{margin:8px 0 0;color:var(--text2)}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) auto;gap:12px;margin-bottom:20px}.search{position:relative}.search input{width:100%;height:44px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 14px 0 40px;outline:0}.search span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.chip{border:1px solid transparent;background:var(--surface);color:var(--text2);border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer}.chip.active{background:var(--primary);color:white}.panel{border:1px solid var(--border);border-radius:12px;background:rgba(245,245,244,.76);overflow:hidden}.panel-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px}.panel-title{font-weight:700;font-size:16px}.muted{color:var(--muted);font-size:14px}.view{display:none}.view.active{display:block}.calendar-wrap{overflow:auto;-webkit-overflow-scrolling:touch}.calendar{min-width:760px}.weekdays,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays{border-bottom:1px solid var(--border);background:var(--surface)}.weekday{padding:10px;text-align:center;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.06em}.cal-grid{background:var(--border);gap:1px}.day{min-height:150px;background:var(--bg);padding:11px}.day.out{background:#f7f5f2;color:#a8a29e}.day.today{box-shadow:inset 0 0 0 2px var(--primary)}.day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.day-num{font-size:14px;font-weight:700}.day-count{font-size:12px;color:var(--muted)}.day-events{min-height:84px;display:flex;flex-direction:column;gap:6px}.event,.list-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--primary);box-shadow:0 1px 0 rgba(28,25,23,.02);cursor:pointer}.event{border-radius:8px;padding:8px 9px;font-size:13px;line-height:1.38}.event:hover{box-shadow:var(--shadow);transform:translateY(-1px)}.meta{white-space:pre-wrap;overflow-wrap:anywhere;}.list-card{flex-direction:column;align-items:flex-start;border-radius:12px;}.meta{font-size:11px;color:var(--muted);margin-top:3px}.event[data-cat="研究"],.list-card[data-cat="研究"]{border-left-color:#a16207}.event[data-cat="老師"],.list-card[data-cat="老師"]{border-left-color:#7c3aed}.event[data-cat="假日"],.list-card[data-cat="假日"]{border-left-color:var(--red);background:#fff1f0}.event[data-cat="備註"],.list-card[data-cat="備註"]{border-left-color:#f59e0b}.event-row{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}.del{cursor:pointer;color:var(--muted);font-size:12px;line-height:1.4;padding:1px 4px;border-radius:4px}.del:hover{color:white;background:var(--red)}.list-view{padding:8px 0}.week-block{padding:18px 20px;border-bottom:1px solid var(--border)}.week-block:last-child{border-bottom:0}.week-title{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}.week-title h3{font-size:19px}.date-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:6px 0}.date-label{font-size:15px;font-weight:700;padding-top:7px}.date-drop{min-height:36px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-radius:10px;padding:5px}.list-card{display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:360px;border-radius:999px;padding:6px 10px 6px 14px}.list-card-title{font-weight:700;font-size:15px}.empty{padding:40px;text-align:center;color:var(--muted)}.sheet-note{margin-top:16px;padding:12px 14px;border-radius:12px;border:1px dashed var(--border);color:var(--text2);font-size:14px;background:rgba(245,245,244,.55)}.drag-ghost{opacity:.35}.drag-chosen{box-shadow:0 12px 28px rgba(28,25,23,.14)!important}.modal-overlay{position:fixed;inset:0;background:rgba(28,25,23,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}.modal-box{background:var(--bg);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-width:430px;width:100%;padding:22px;border:1px solid var(--border)}.modal-title{font-weight:800;margin-bottom:8px}.modal-label{display:block;margin-top:10px}.modal-label span{display:block;font-size:13px;font-weight:700;color:var(--text2);margin-bottom:5px}.modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:.25s;z-index:1000;max-width:80vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}body.readonly .edit-only,body.readonly .del{display:none!important}body.readonly .event,body.readonly .list-card{cursor:default}body.readonly .event:hover{transform:none}.hidden{display:none!important}@media(max-width:900px){:root{--sidebar:220px}.main{padding:24px 20px 48px}.headline h2{font-size:36px}.toolbar{grid-template-columns:1fr}.chips{justify-content:flex-start}}@media(max-width:720px){.app{display:block}.sidebar{display:none}.main{padding:20px 14px 40px}.topbar{display:block}.actions{margin-top:16px;justify-content:flex-start}.headline h2{font-size:32px}.date-row{grid-template-columns:78px 1fr}.list-card{min-width:100%;max-width:none}.calendar{min-width:690px}.day{min-height:138px}}
</style>

<body class="readonly">
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="eyebrow">Ember Studio</div><h1>專案時程</h1></div>
  <div class="nav-section"><div class="nav-label">檢視</div><button class="nav-btn active" data-view="calendar">▦　行事曆</button><button class="nav-btn" data-view="list">☷　清單</button></div>
  <div class="nav-section"><div class="nav-label">分類</div><div class="legend" id="legend"></div></div>
  <div class="nav-section"><div class="nav-label">資料</div><button class="nav-btn" id="exportDataBtn">⭳　匯出目前排程</button><button class="nav-btn" id="exportIcsBtn">⭳　匯出至 Google 日曆</button></div>
  <div class="nav-section"><div class="nav-label">狀態</div><div class="status" id="statusLine">讀取中…</div></div>
</aside>
<main class="main"><div class="container">
  <div class="topbar"><div class="headline"><div class="eyebrow">Course project timeline</div><h2 id="viewTitle">專案時程｜行事曆</h2><p id="modeText">公開檢視模式</p></div><div class="actions"><button class="btn" id="refreshBtn">重新整理資料</button><button class="btn icon" id="prevBtn">←</button><button class="btn" id="todayBtn">今天</button><button class="btn icon" id="nextBtn">→</button><button class="btn primary" id="toggleBtn">切換清單</button></div></div>
  <div class="status" id="mobileStatus" role="status" style="margin-bottom:16px">讀取中…</div><div class="toolbar"><div class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="搜尋任務、週次、關鍵字…"></div><div class="chips" id="chips"></div></div>
  <section class="panel"><div class="panel-head"><div><div class="panel-title" id="periodLabel"></div><div class="muted" id="countLabel"></div></div><div class="muted" id="helpText">每 60 秒檢查更新</div></div><div class="view active" id="calendarView"><div class="calendar-wrap"><div class="calendar"><div class="weekdays"><div class="weekday">Sun.</div><div class="weekday">Mon.</div><div class="weekday">Tue.</div><div class="weekday">Wed.</div><div class="weekday">Thu.</div><div class="weekday">Fri.</div><div class="weekday">Sat.</div></div><div class="cal-grid" id="calGrid"></div></div></div></div><div class="view" id="listView"><div class="list-view" id="listRoot"></div></div></section>
  <div class="sheet-note">資料來源：Google 試算表「時程（測試）」。請在試算表修改行程；Google 發布更新可能需要幾分鐘。</div>
</div></main>
</div>
<script>
// 將 Google「發布到網路」產生的 CSV 連結貼在引號裡。
const PUBLISHED_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT4b7q3dOog9utVVntjHUUg86TiKbsi4pcMrGsNj5ZEMy6q_TRAsXDKqdJCH2fB_KWItLXrGN1foB5K/pub?gid=1872543621&single=true&output=csv';
const cats=['全部','行銷','研究','老師','假日','備註'];
const catColors={行銷:'#c2410c',研究:'#a16207',老師:'#7c3aed',假日:'#dc2626',備註:'#f59e0b'};
let events=[],currentView='calendar',filter='全部',query='',cursor=new Date(new Date().getFullYear(),new Date().getMonth(),1),loading=false,firstLoad=true;
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function fmtDate(s){return new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric',weekday:'short'}).format(new Date(s+'T00:00:00'))}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('show'));setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),300)},2400)}
function sourceWeekForDate(date){const t=new Date(date+'T00:00:00');const d=(t.getDay()+6)%7;const th=new Date(t);th.setDate(t.getDate()-d+3);const first=new Date(th.getFullYear(),0,4);const firstMon=new Date(first);firstMon.setDate(first.getDate()-((first.getDay()+6)%7));return 'W'+(Math.floor((th-firstMon)/604800000)+1)}
function isoWeekYear(date){const t=new Date(date+'T00:00:00');const d=(t.getDay()+6)%7;const th=new Date(t);th.setDate(t.getDate()-d+3);return th.getFullYear()}
function visible(e){const q=query.trim().toLowerCase();return (filter==='全部'||e.category===filter)&&(!q||`${e.title} ${e.category} ${e.week} ${e.owner} ${e.note}`.toLowerCase().includes(q))}
function renderCalendar(){const y=cursor.getFullYear(),m=cursor.getMonth();$('periodLabel').textContent=`${y} 年 ${m+1} 月`;const first=new Date(y,m,1),start=new Date(first);start.setDate(1-first.getDay());let out='',today=iso(new Date());for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=iso(d),evs=events.filter(e=>e.date===ds&&visible(e));out+=`<div class="day ${d.getMonth()===m?'':'out'} ${ds===today?'today':''}" data-date="${ds}"><div class="day-head"><span class="day-num">${d.getDate()}</span><span class="day-count">${evs.length?evs.length+' 項':''}</span></div><div class="day-events">${evs.map(e=>eventHTML(e,'cal')).join('')}</div></div>`}$('calGrid').innerHTML=out;initSortables('.day-events',true)}
function renderList(){const map=new Map();events.filter(visible).forEach(e=>{const key=`${isoWeekYear(e.date)} · ${e.week}`;if(!map.has(key))map.set(key,[]);map.get(key).push(e)});let html='';[...map.entries()].sort((a,b)=>a[1][0].date.localeCompare(b[1][0].date)).forEach(([week,items])=>{html+=`<section class="week-block"><div class="week-title"><h3>${esc(week)}</h3></div>`;const byDate={};items.forEach(e=>{if(!byDate[e.date])byDate[e.date]=[];byDate[e.date].push(e)});Object.keys(byDate).sort().forEach(date=>{html+=`<div class="date-row"><div class="date-label">${fmtDate(date)}</div><div class="date-drop" data-date="${date}">${byDate[date].map(e=>eventHTML(e,'list')).join('')}</div></div>`});html+='</section>'});$('listRoot').innerHTML=html||'<div class="empty">沒有符合條件的日程</div>';initSortables('.date-drop',false)}
function renderAll(){renderCalendar();renderList();const shown=events.filter(visible).length;$('countLabel').textContent=`顯示 ${shown} / ${events.length} 個日程`;['prevBtn','nextBtn','todayBtn'].forEach(id=>$(id).style.visibility=currentView==='calendar'?'visible':'hidden')}
function setView(v){currentView=v;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===(v==='calendar'?'calendarView':'listView')));document.querySelectorAll('.nav-btn[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$('viewTitle').textContent=v==='calendar'?'專案時程｜行事曆':'專案時程｜清單';$('toggleBtn').textContent=v==='calendar'?'切換清單':'切換行事曆';renderAll()}
function exportData(){download('schedule-backup.json',JSON.stringify({exportedAt:new Date().toISOString(),source:'Google 試算表時程',events},null,2),'application/json')}
function exportICS(){const pad=n=>String(n).padStart(2,'0'),ds=s=>s.replace(/-/g,''),add=s=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+1);return iso(d)},now=new Date(),stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z',escI=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ember Studio//Project Schedule//ZH-TW','CALSCALE:GREGORIAN'];events.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>lines.push('BEGIN:VEVENT','UID:'+e.id+'-goldenfish@eritung','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+ds(e.date),'DTEND;VALUE=DATE:'+ds(add(e.date)),'SUMMARY:'+escI(e.title),'CATEGORIES:'+escI(e.category),'DESCRIPTION:'+escI(`分類：${e.category}／週次：${e.week}／時間：${e.start}–${e.end}／負責人：${e.owner}／備註：${e.note}`),'END:VEVENT'));lines.push('END:VCALENDAR');download('project-schedule.ics',lines.join('\r\n'),'text/calendar')}
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:type+';charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}


function canWrite(){return false}
function initSortables(){}
function setStatus(msg,type=''){for(const id of ['statusLine','mobileStatus']){$(id).textContent=msg;$(id).className='status '+type}}
function renderSetup(){
 $('legend').innerHTML=cats.slice(1).map(c=>`<div class="legend-row"><span class="dot" style="background:${catColors[c]}"></span>${c}</div>`).join('');
 $('chips').innerHTML=cats.map(c=>`<button class="chip ${c===filter?'active':''}" data-filter="${c}">${c}</button>`).join('');
 document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{filter=c.dataset.filter;renderSetup();renderAll()});
}
function eventHTML(e,mode='cal'){
 const details=[ [e.start,e.end].filter(Boolean).join('–'), e.owner&&'負責人：'+e.owner,e.note].filter(Boolean).join('\n');
 return `<div class="${mode==='cal'?'event':'list-card'}" data-cat="${esc(e.category)}"><span class="${mode==='cal'?'':'list-card-title'}">${esc(e.title)}</span><div class="meta">${esc(e.category)} · ${esc(e.week)}${details?'\n'+esc(details):''}</div></div>`;
}
function parseCSV(text){
 const rows=[];let row=[],cell='',quoted=false;
 for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}
 else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}
 if(quoted)throw Error('CSV 引號格式不完整');if(cell||row.length){row.push(cell);rows.push(row)}return rows;
}
function normalizeDate(value){const m=value.trim().match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);if(!m)return null;const d=new Date(+m[1],+m[2]-1,+m[3]);return d.getFullYear()===+m[1]&&d.getMonth()===+m[2]-1&&d.getDate()===+m[3]?iso(d):null}
function rowsToEvents(rows){
 const headers=(rows.shift()||[]).map(s=>s.replace(/^\uFEFF/,'').trim());
 for(const key of ['日期','開始時間','結束時間','行程','負責人','備註'])if(!headers.includes(key))throw Error('缺少欄位：'+key+'；請確認發布的是「時程（測試）」CSV');
 let skipped=0;const result=[];
 rows.forEach((r,i)=>{if(!r.some(v=>v.trim()))return;const get=k=>(r[headers.indexOf(k)]||'').trim(),date=normalizeDate(get('日期')),title=get('行程');if(!date||!title){skipped++;return}
 const category=cats.slice(1).includes(get('分類'))?get('分類'):'備註';result.push({id:'sheet-row-'+(i+2),date,title,category,week:sourceWeekForDate(date),start:get('開始時間'),end:get('結束時間'),owner:get('負責人'),note:get('備註')})});
 result.sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start,undefined,{numeric:true}));return {result,skipped};
}
async function loadEvents(){
 if(loading)return;
 if(!PUBLISHED_CSV_URL){setStatus('尚未連接：請在 index.html 的 PUBLISHED_CSV_URL 填入分頁發布的 CSV 連結。','warn');return}
 loading=true;$('refreshBtn').disabled=true;
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
 try{const url=new URL(PUBLISHED_CSV_URL);if(url.hostname!=='docs.google.com'||!url.pathname.includes('/pub')||url.searchParams.get('output')!=='csv')throw Error('請使用 Google 發布到網路產生的 CSV 連結');
 const response=await fetch(url,{cache:'no-store',signal:controller.signal});if(!response.ok)throw Error('無法讀取發布內容（'+response.status+'）');
 const {result,skipped}=rowsToEvents(parseCSV(await response.text()));events=result;
 if(firstLoad&&events.length){const month=iso(cursor).slice(0,7);if(!events.some(e=>e.date.startsWith(month)))cursor=new Date(events[0].date+'T00:00:00');firstLoad=false}
 renderAll();setStatus(`已讀取 ${events.length} 筆 · ${new Date().toLocaleTimeString('zh-TW')}（每 60 秒檢查；Google 發布可能延遲數分鐘）`+(skipped?` · 略過 ${skipped} 列：日期或行程未填妥`:''),skipped?'warn':'ok');
 }catch(error){setStatus('更新失敗，保留上次資料。請確認分頁已發布為 CSV。'+(error.name==='AbortError'?'讀取逾時':error.message),'err')}
 finally{clearTimeout(timer);loading=false;$('refreshBtn').disabled=false}
}
