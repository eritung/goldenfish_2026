<style>
:root{--primary:#C2410C;--primary-hover:#9A3412;--accent:#F59E0B;--neutral:#78716C;--bg:#FAFAF9;--surface:#F5F5F4;--raised:#E7E5E4;--text:#1C1917;--text2:#57534E;--border:#D6D3D1;--success:#16A34A;--warning:#D97706;--error:#DC2626;--sidebar:256px;--shadow:0 4px 16px rgba(28,25,23,.06)}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--bg);color:var(--text);font-family:"Source Sans 3",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.48} button,input{font:inherit}
button{touch-action:manipulation} .app{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--border);background:rgba(250,250,249,.94);backdrop-filter:blur(14px);z-index:30;overflow:auto}
.brand{padding:4px 8px 24px} .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--neutral);font-weight:600} h1,h2,h3{font-family:"Playfair Display",serif;letter-spacing:-.02em;margin:0} h1{font-size:30px;line-height:1.15;margin-top:5px} .subtitle{color:var(--text2);font-size:15px;margin:8px 0 0}
.nav-section{margin-top:20px} .nav-label{padding:0 10px 8px;color:var(--neutral);font-size:13px;font-weight:600} .nav-btn{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--text2);padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;position:relative} .nav-btn:hover{background:var(--surface)} .nav-btn.active{color:var(--primary);background:#FFF2EC} .nav-btn.active:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--primary);border-radius:99px}
.legend{display:grid;gap:8px;margin-top:8px} .legend-row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);padding:0 10px} .dot{width:8px;height:8px;border-radius:99px}
.main{min-width:0;padding:32px 32px 64px} .container{max-width:1200px;margin:auto}
.topbar{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:24px} .headline h2{font-size:44px;line-height:1.05} .headline p{margin:8px 0 0;color:var(--text2)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end} .btn{height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);font-weight:600;cursor:pointer;transition:.15s} .btn:hover{background:var(--surface)} .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff} .btn.primary:hover{background:var(--primary-hover);box-shadow:0 4px 12px rgba(194,65,12,.25)} .btn.icon{width:40px;padding:0;display:grid;place-items:center}
.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) auto;gap:12px;margin-bottom:20px} .search{position:relative} .search input{width:100%;height:44px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 14px 0 40px;color:var(--text);outline:0} .search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(194,65,12,.12)} .search span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--neutral)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end} .chip{border:1px solid transparent;background:var(--surface);color:var(--text2);border-radius:9999px;padding:8px 14px;font-size:15px;cursor:pointer} .chip.active{background:var(--primary);color:white}
.panel{border:1px solid var(--border);border-radius:12px;background:rgba(245,245,244,.76);overflow:hidden} .panel-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px} .panel-title{font-weight:600;font-size:16px} .muted{color:var(--neutral);font-size:14px}
.view{display:none} .view.active{display:block}
/* Calendar */
.calendar-wrap{overflow:auto;-webkit-overflow-scrolling:touch} .calendar{min-width:760px} .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);background:var(--surface)} .weekday{padding:10px;text-align:center;font-size:13px;color:var(--neutral);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--border);gap:1px} .day{min-height:150px;background:var(--bg);padding:11px;position:relative} .day.out{background:#F7F5F2;color:#A8A29E} .day.today{box-shadow:inset 0 0 0 2px var(--primary)} .day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px} .day-num{font-size:14px;font-weight:600} .day-count{font-size:12px;color:var(--neutral)} .day-events{min-height:84px;display:flex;flex-direction:column;gap:6px}
.event{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:8px;padding:8px 9px;font-size:13px;line-height:1.38;cursor:grab;box-shadow:0 1px 0 rgba(28,25,23,.02)} .event:hover{box-shadow:var(--shadow);transform:translateY(-1px)} .event:active{cursor:grabbing} .event .meta{font-size:11px;color:var(--neutral);margin-top:3px} .event[data-cat="研究"]{border-left-color:#A16207} .event[data-cat="老師"]{border-left-color:#7C3AED} .event[data-cat="假日"]{border-left-color:var(--error);background:#FFF1F0} .event[data-cat="備註"]{border-left-color:var(--accent)} .event.filtered{display:none}
.event-row{display:flex;align-items:flex-start;justify-content:space-between;gap:6px} .evt-del{cursor:pointer;color:var(--neutral);font-size:12px;line-height:1.4;padding:1px 4px;border-radius:4px;flex:0 0 auto} .evt-del:hover{color:#fff;background:var(--error)}
.add-field{height:38px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 10px;color:var(--text);width:100%}
.note-band{font-size:12px;background:#FFF7E6;color:#92400E;border:1px solid #F9D899;border-radius:7px;padding:6px 8px;margin-bottom:6px}
/* List */
.list-view{padding:8px 0} .week-block{padding:18px 20px;border-bottom:1px solid var(--border)} .week-block:last-child{border-bottom:0} .week-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px} .week-title{display:flex;align-items:baseline;gap:10px} .week-title h3{font-family:"Source Sans 3",sans-serif;font-size:19px;letter-spacing:0} .week-range{font-size:14px;color:var(--neutral)} .week-summary{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px} .summary-pill{font-size:13px;background:var(--bg);border:1px solid var(--border);padding:7px 10px;border-radius:9999px;color:var(--text2)}
.date-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:6px 0} .date-label{font-size:15px;font-weight:700;color:var(--text);padding-top:7px} .date-drop{min-height:36px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-radius:10px;padding:5px;transition:.15s} .date-drop.drag-over{background:#FFF2EC;box-shadow:inset 0 0 0 1px rgba(194,65,12,.2)} .list-card{display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:360px;flex:0 1 auto;background:var(--bg);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:9999px;padding:6px 10px 6px 14px;cursor:grab} .list-card[data-cat="研究"]{border-left-color:#A16207} .list-card[data-cat="老師"]{border-left-color:#7C3AED} .list-card[data-cat="假日"]{border-left-color:var(--error)} .list-card-title{font-weight:600;font-size:15px} .list-card-meta{font-size:13px;color:var(--neutral);margin-top:4px}
.empty{padding:40px;text-align:center;color:var(--neutral)}
/* Mobile */
.mobile-head{display:none} .sheet-note{margin-top:16px;padding:12px 14px;border-radius:12px;border:1px dashed var(--border);color:var(--text2);font-size:14px;background:rgba(245,245,244,.55)}
.drag-ghost{opacity:.35} .drag-chosen{box-shadow:0 12px 28px rgba(28,25,23,.14)!important} .sortable-fallback{opacity:.95;transform:rotate(1deg)}
.modal-overlay{position:fixed;inset:0;background:rgba(28,25,23,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-box{background:var(--bg);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-width:420px;width:100%;padding:22px 22px 16px;border:1px solid var(--border)}
.modal-msg{font-size:15px;line-height:1.55;color:var(--text);white-space:pre-line}
.modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:9999px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .25s,transform .25s;z-index:1000;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){:root{--sidebar:220px} .main{padding:24px 20px 48px} .headline h2{font-size:36px} .toolbar{grid-template-columns:1fr} .chips{justify-content:flex-start}}

</style>

function icsEscape(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function icsPad(n){return String(n).padStart(2,'0')}
function icsDateStr(dateStr){return dateStr.replace(/-/g,'')}

function buildICS(){
  const now=new Date();
  const dtstamp=now.getUTCFullYear()+icsPad(now.getUTCMonth()+1)+icsPad(now.getUTCDate())+'T'+icsPad(now.getUTCHours())+icsPad(now.getUTCMinutes())+icsPad(now.getUTCSeconds())+'Z';
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ember Studio//專案時程//ZH-TW','CALSCALE:GREGORIAN'];
  const sorted=[...events].sort((a,b)=>a.date.localeCompare(b.date));
  sorted.forEach(e=>{
    lines.push('BEGIN:VEVENT');
    lines.push('UID:'+e.id+'-ember-schedule@eritung');
    lines.push('DTSTAMP:'+dtstamp);
    lines.push('DTSTART;VALUE=DATE:'+icsDateStr(e.date));
    lines.push('DTEND;VALUE=DATE:'+icsDateStr(addDaysStr(e.date,1)));
    lines.push('SUMMARY:'+icsEscape(e.title));
    lines.push('CATEGORIES:'+icsEscape(e.category));
    lines.push('DESCRIPTION:'+icsEscape(`分類：${e.category}／週次：${e.week}`));
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
async function exportToGoogleCalendar(){
  const ics=buildICS();
  // 在 claude.ai 平台上執行時，走平台的下載功能（但它不開放 .ics 副檔名，只能先存成 .txt 再手動改名）
  if(typeof window.claude?.use==='function'){
    let downloads=null; try{ downloads=await window.claude.use('downloads') }catch(e){ downloads=null }
    if(downloads){
      try{
        await downloads.save({filename:'專案時程.txt', data: ics});
        await customAlert('已下載「專案時程.txt」（共 '+events.length+' 筆）。\n\n因為平台下載功能不支援 .ics 副檔名，請先把檔名結尾的 .txt 改成 .ics（例如「專案時程.ics」），再到 Google 日曆網頁版 → 設定 → 匯入及匯出 → 匯入 → 選擇這個檔案上傳。');
        return;
      }catch(err){ /* 平台下載失敗，往下改用瀏覽器直接下載 */ }
    }
  }
  // 離線開啟這個 HTML 檔案（不受平台副檔名限制）時，直接下載正確的 .ics 檔案
  try{
    const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='project-schedule.ics';document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    await customAlert('已下載「project-schedule.ics」（共 '+events.length+' 筆）。\n\n打開 Google 日曆網頁版 → 設定 → 匯入及匯出 → 匯入 → 選擇這個檔案上傳即可。');
  }catch(err){
    copyICSFallback();
  }
}

}

    if(rowEnd<today0) continue; // 隱藏已完全過去的整週
    for(let d=new Date(rowStart);d<=rowEnd;d.setDate(d.getDate()+1)){const ds=iso(d), inMonth=d.getMonth()===m;const dayEvents=events.filter(e=>e.date===ds&&visibleEvent(e));const notes=SOURCE_NOTES.filter(n=>n.date===ds);const isToday=ds===iso(new Date());out+=`<div class="day ${inMonth?'':'out'} ${isToday?'today':''}" data-date="${ds}"><div class="day-head"><span class="day-num">${d.getDate()}</span><span class="day-count">${dayEvents.length?dayEvents.length+' 項':''}</span></div>${notes.map(n=>`<div class="note-band">${esc(n.text)}</div>`).join('')}<div class="day-events">${dayEvents.map(e=>eventHTML(e,'cal')).join('')}</div></div>`}
  }
  grid.innerHTML=out||'<div class="empty">本月已無未來週次</div>';initSortables('.day-events',true);
}
function renderList(){
 const root=document.getElementById('listRoot');const weeks=[];
 for(const w of WEEK_SUMMARIES){if(!weeks.some(x=>x.week===w.week))weeks.push(w)}
 // include W43 etc that may have no summary but do have dates/events
 for(const e of events){if(!weeks.some(x=>x.week===e.week)){const d=new Date(e.date+'T00:00:00');const mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));const fri=new Date(mon);fri.setDate(mon.getDate()+4);weeks.push({week:e.week,start:iso(mon),end:iso(fri),items:[]})}}
 const today0=startOfToday();
 weeks.sort((a,b)=>a.start.localeCompare(b.start));let html='';
 for(const w of weeks){if(new Date(w.end+'T00:00:00')<today0) continue; // 隱藏已完全過去的週次
 const weekEvents=events.filter(e=>e.date>=w.start&&e.date<=w.end&&visibleEvent(e));const noteItems=SOURCE_NOTES.filter(n=>n.week===w.week);const searchInSummary=!query||((w.items||[]).some(i=>i.text.toLowerCase().includes(query.toLowerCase())));if(!weekEvents.length&&!searchInSummary&&query)continue;
 html+=`<section class="week-block"><div class="week-head"><div><div class="week-title"><h3>${isoWeekYear(w.start)} · ${esc(w.week)}</h3><span class="week-range">${fmtDate(w.start)} – ${fmtDate(w.end)}</span></div>${(w.items||[]).length?`<div class="week-summary">${w.items.map(i=>`<span class="summary-pill">${esc(i.category)} · ${esc(i.text)}</span>`).join('')}</div>`:''}</div>${noteItems.length?`<div class="muted">${noteItems.map(n=>'※ '+esc(n.text)).join('<br>')}</div>`:''}</div>`;
 for(let d=new Date(w.start+'T00:00:00');d<=new Date(w.end+'T00:00:00');d.setDate(d.getDate()+1)){const ds=iso(d), de=events.filter(e=>e.date===ds&&visibleEvent(e));if(!de.length)continue;html+=`<div class="date-row"><div class="date-label">${fmtDate(ds)}</div><div class="date-drop" data-date="${ds}">${de.map(e=>eventHTML(e,'list')).join('')}</div></div>`}
 html+='</section>'}
 root.innerHTML=html||'<div class="empty">沒有符合條件的日程</div>';initSortables('.date-drop',false);
}
function initSortables(selector,isCalendar){if(!window.Sortable)return;document.querySelectorAll(selector).forEach(el=>{new Sortable(el,{group:'schedule',animation:160,delay:120,delayOnTouchOnly:true,touchStartThreshold:4,ghostClass:'drag-ghost',chosenClass:'drag-chosen',fallbackOnBody:true,swapThreshold:.6,filter:'.evt-del',preventOnFilter:false,onAdd(evt){const card=evt.item;const parent=isCalendar?card.closest('.day'):card.closest('.date-drop');const date=parent?.dataset.date;if(date)moveEvent(card.dataset.id,date)},onUpdate(evt){saveEvents()}})})}

document.querySelectorAll('.nav-btn[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
document.getElementById('toggleBtn').addEventListener('click',()=>setView(currentView==='calendar'?'list':'calendar'));
document.getElementById('mobileViewBtn').addEventListener('click',()=>setView(currentView==='calendar'?'list':'calendar'));
document.getElementById('resetBtn').addEventListener('click',resetEvents);
document.getElementById('exportIcsBtn').addEventListener('click',exportToGoogleCalendar);
document.getElementById('addEventBtn').addEventListener('click',addEvent);
document.addEventListener('click',e=>{const delBtn=e.target.closest('.evt-del');if(delBtn){e.stopPropagation();deleteEvent(delBtn.dataset.id)}});
document.addEventListener('click',e=>{
  if(e.target.closest('.evt-del')) return;
  const card=e.target.closest('.event, .list-card');
  if(card) openDateEditor(card.dataset.id);
});
['mousedown','pointerdown','touchstart'].forEach(evtName=>{
  document.addEventListener(evtName,e=>{if(e.target.closest('.evt-del'))e.stopPropagation()},true);
});
document.getElementById('prevBtn').addEventListener('click',()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);renderCalendar()});
document.getElementById('nextBtn').addEventListener('click',()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);renderCalendar()});
document.getElementById('todayBtn').addEventListener('click',()=>{const now=new Date();cursor=(now>=new Date(minDate)&&now<=new Date(maxDate))?new Date(now.getFullYear(),now.getMonth(),1):new Date('2026-09-01');renderCalendar()});
document.getElementById('searchInput').addEventListener('input',e=>{query=e.target.value;renderAll()});
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');filter=c.dataset.filter;renderAll()}));
setView('calendar');
</script>
